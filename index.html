<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1320" media="(prefers-color-scheme: dark)">
<meta name="description" content="Quiz per la patente B con l'archivio ufficiale del Ministero, simulazione d'esame e test dei riflessi.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patente Pronta">
<title>Patente Pronta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: colonna stretta (max 560px), navigazione in basso. Il blu segnaletica compare solo nel pulsante d'esame e negli elementi attivi; il resto resta sobrio. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#0F1C2E; --muted:#5B6B7F; --line:#D6DDE7;
  --sign:#0D4FA3; --sign-ink:#FFFFFF; --link:#0D4FA3;
  --ok:#0B7A4B; --ok-bg:#DCF2E6; --bad:#B8141B; --bad-bg:#FBE2E2;
  --wait:#1B2B44; --go:#16A05D; --early:#B8141B;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1320; --surface:#131F33; --ink:#E7EDF6; --muted:#93A3B8; --line:#25354D;
    --sign:#1B66C4; --link:#7DB4FF; --ok:#52D6A0; --ok-bg:#103A2B; --bad:#FF8F94; --bad-bg:#47191D;
    --wait:#0F1A2B; --go:#1FB36B; --early:#C2262D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1320; --surface:#131F33; --ink:#E7EDF6; --muted:#93A3B8; --line:#25354D;
  --sign:#1B66C4; --link:#7DB4FF; --ok:#52D6A0; --ok-bg:#103A2B; --bad:#FF8F94; --bad-bg:#47191D;
  --wait:#0F1A2B; --go:#1FB36B; --early:#C2262D; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45;
  padding-block:16px 96px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body.hidenav{padding-bottom:32px}
body.hidenav #nav{display:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:40px;font-weight:700;letter-spacing:.01em}
h2{font-size:26px;font-weight:700}
h3{font-size:20px;font-weight:600}
p{margin:0}
.head p{color:var(--muted);margin-top:6px;max-width:46ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:14px}

/* pulsante d'esame: cartello blu con filetto bianco interno */
.examcard{
  position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;
  background:var(--sign);color:var(--sign-ink);border:0;border-radius:16px;padding:22px 22px 20px;
}
.examcard::before{content:"";position:absolute;inset:6px;border:2px solid rgba(255,255,255,.85);border-radius:11px;pointer-events:none}
.examcard .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.examcard .meta{opacity:.92}
.examcard .go{font-family:var(--display);font-size:20px;font-weight:600;margin-top:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;min-height:84px;min-width:0}
.tile b{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.1}
.tile span{color:var(--muted);font-size:14px}
.tile.wide{grid-column:1 / -1;min-height:0}
.tile:disabled{opacity:.55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sign);border-radius:99px}
.note{font-size:13px;color:var(--muted)}
.note a{color:var(--link)}

.listbtn{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;min-width:0}
.listbtn .l{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.listbtn .l b{font-weight:600;min-width:0}
.listbtn .l em{font-style:normal;color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.listbtn:disabled{opacity:.55}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ghost{background:none;border:0;padding:10px 4px;font-weight:600;color:var(--link);min-height:44px}
.cnt{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;min-width:0}
.tm{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.tm.low{color:var(--bad)}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--sign);border-radius:99px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px}
.qtext{font-size:20px;line-height:1.35;font-weight:500;text-wrap:pretty}
.fig{display:block;margin:0 auto 14px;max-width:100%;max-height:260px;width:auto;height:auto;background:#fff;border-radius:10px;border:1px solid var(--line)}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.abtn{
  min-height:72px;border-radius:12px;border:2px solid var(--line);background:var(--surface);
  font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
}
.abtn:active:not(:disabled){transform:scale(.98)}
.abtn.sel{border-color:var(--sign);background:var(--sign);color:var(--sign-ink)}
.abtn.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.abtn.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.fb{border-radius:12px;padding:14px 16px;border:1px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.btn{
  min-height:52px;border-radius:12px;border:0;background:var(--sign);color:var(--sign-ink);
  font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.03em;padding:0 20px;width:100%;
}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.5}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{
  min-height:56px;border-radius:10px;border:2px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--display);font-size:22px;font-weight:700;line-height:1;
}
.cell small{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.cell.empty{border-style:dashed}
.cell.done{border-color:var(--sign)}
.loading{display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* esito */
.verdict{border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:6px}
.verdict.pass{background:var(--ok-bg);color:var(--ok)}
.verdict.fail{background:var(--bad-bg);color:var(--bad)}
.verdict.plain{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.verdict b{font-family:var(--display);font-size:42px;font-weight:700;line-height:1}
.verdict span{color:var(--ink)}
.rev{display:flex;flex-direction:column;gap:8px}
.rev .fig{max-height:120px;margin:0 0 4px;align-self:flex-start;object-fit:contain}
.rev .tag{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:8px}
.hist div{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.pill{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px}
.pill.pass{background:var(--ok-bg);color:var(--ok)}
.pill.fail{background:var(--bad-bg);color:var(--bad)}

/* riflessi */
.big-n{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.rts{display:flex;gap:8px;flex-wrap:wrap}
.rts span{font-family:var(--display);font-size:20px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-variant-numeric:tabular-nums}
.arena{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  text-align:center;color:#fff;background:var(--wait);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  padding:max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
}
.arena[hidden]{display:none}
.arena.go{background:var(--go)}
.arena.early{background:var(--early)}
.arena-x{
  position:absolute;left:max(12px, env(safe-area-inset-left, 0px));top:calc(env(safe-area-inset-top, 0px) + 12px);
  background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:0 16px;min-height:44px;font-weight:600;
}
.ar-top{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.ar-big{font-family:var(--display);font-size:56px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.ar-sub{font-size:18px;opacity:.9;max-width:28ch}
@media (prefers-reduced-motion: no-preference){.abtn,.btn{transition:transform .08s}}

/* navigazione */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#nav button{
  background:none;border:0;border-radius:10px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:12px;font-weight:600;color:var(--muted);
}
#nav button[aria-current="page"]{color:var(--link)}
#nav svg{width:22px;height:22px}
</style>
<style>
/* Base della pagina quando non è dentro Claude */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="app"></div>

<div id="arena" class="arena" hidden tabindex="0" aria-label="Area di reazione: tocca quando arriva il segnale">
  <button class="arena-x" data-act="reflex-exit">Esci</button>
  <div class="ar-top" id="ar-top"></div>
  <div class="ar-big" id="ar-big"></div>
  <div class="ar-sub" id="ar-sub"></div>
</div>

<nav id="nav" aria-label="Sezioni">
  <div class="in">
    <button data-act="tab" data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-act="tab" data-t="topics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Argomenti</button>
    <button data-act="tab" data-t="exam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Esame</button>
    <button data-act="tab" data-t="reflex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>Riflessi</button>
  </div>
</nav>

<script>
/* ---------- Archivio ministeriale ----------
   bank.json: { v: data del listato, c: [[titolo capitolo, n. domande]], q: [[idMinistero, capitolo, risposta(1=Vero), figura(-1 = nessuna), gruppo, testo]] }
   Le figure sono in f/<n>.jpg. */
let B=null, Q=[], CH=[], bankErr=false;
const ID=0,CAP=1,ANS=2,IMG=3,GRP=4,TXT=5;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fig=(i,cls)=>i<0?'':`<img class="fig" src="f/${i}.jpg" alt="Figura del quesito" ${cls||''}>`;
const SIGNAL_CH=[1,2,3,4,5,6,7,8];

function loadBank(){
  bankErr=false;
  fetch('bank.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(d=>{
    B=d;Q=d.q;CH=d.c.map(()=>[]);
    Q.forEach((q,i)=>CH[q[CAP]].push(i));
    render();
  }).catch(()=>{bankErr=true;render();});
}

/* ---------- Archivio locale ---------- */
const def=()=>({seen:{},total:0,correct:0,exams:[],reflex:{}});
function load(){
  try{const j=JSON.parse(localStorage.getItem('pp_v2'));if(j&&typeof j==='object')return Object.assign(def(),j);}catch(e){}
  const s=def();
  try{const o=JSON.parse(localStorage.getItem('pp_v1'));if(o){s.exams=o.exams||[];s.reflex=o.reflex||{};}}catch(e){}
  return s;
}
function save(){try{localStorage.setItem('pp_v2',JSON.stringify(store));}catch(e){}}
let store=load(), tab='home', S=null, R=null, RES=null;

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pct=(n,d)=>d?Math.round(100*n/d):null;
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const nf=n=>n.toLocaleString('it-IT');
const wrongPool=()=>{const out=[];for(let i=0;i<Q.length;i++)if(store.seen[Q[i][ID]]===0)out.push(i);return out;};
function chapStats(c){let seen=0,ok=0;for(const i of CH[c]){const s=store.seen[Q[i][ID]];if(s!==undefined){seen++;if(s===1)ok++;}}return{seen,ok,n:CH[c].length};}

function rec(i,ok){
  store.total++;if(ok)store.correct++;
  store.seen[Q[i][ID]]=ok?1:0;save();
}
function pickSeries(pool,n){
  const wrong=[],unseen=[],good=[];
  pool.forEach(i=>{const s=store.seen[Q[i][ID]];(s===0?wrong:s===1?good:unseen).push(i);});
  const out=[],used=new Set();
  const take=(arr,k)=>{for(const x of shuffle(arr)){if(k<=0||out.length>=n)break;if(!used.has(x)){used.add(x);out.push(x);k--;}}};
  take(wrong,Math.ceil(n/2));take(unseen,n-out.length);take(good,n-out.length);take(wrong,n-out.length);
  return shuffle(out);
}

/* ---------- Viste ---------- */
function loadingView(){
  return bankErr
    ?`<div class="wrap loading"><h2>Archivio non raggiunto</h2><p class="muted">Controlla la connessione e riprova.</p><button class="btn" data-act="retry">Riprova</button></div>`
    :`<div class="wrap loading"><h2>Carico l'archivio ufficiale…</h2><p class="muted">Sono più di 7.000 domande con le figure. Succede solo alla prima apertura.</p></div>`;
}
function homeView(){
  const ex=store.exams,passed=ex.filter(e=>e.pass).length,wl=wrongPool().length;
  const seenN=Object.keys(store.seen).length,acc=pct(store.correct,store.total);
  return `<div class="wrap">
    <header class="head"><h1>Patente Pronta</h1><p>Teoria patente B con l'archivio ufficiale del Ministero, simulazione d'esame e test dei riflessi.</p></header>
    <button class="examcard" data-act="exam-start"><span class="eyebrow">Come all'esame vero</span><span class="big">Simulazione d'esame</span><span class="meta">30 domande · 20 minuti · massimo 3 errori</span><span class="go">Inizia →</span></button>
    <div class="two">
      <button class="card tile" data-act="tab" data-t="topics"><b>Quiz per argomento</b><span>${CH.length} capitoli, ${nf(Q.length)} domande</span></button>
      <button class="card tile" data-act="errors-start" ${wl?'':'disabled'}><b>Ripassa gli errori</b><span>${wl?nf(wl)+' da rivedere':'Nessun errore in sospeso'}</span></button>
      <button class="card tile" data-act="signals-start"><b>Segnali con figure</b><span>Serie da 20 sui cartelli e la segnaletica</span></button>
      <button class="card tile" data-act="tab" data-t="reflex"><b>Test dei riflessi</b><span>Visivi, uditivi e misti</span></button>
    </div>
    <div class="card stats">
      <div class="stat"><b>${nf(seenN)}</b><span>domande viste su ${nf(Q.length)}</span></div>
      <div class="stat"><b>${acc===null?'–':acc+'%'}</b><span>risposte corrette</span></div>
      <div class="stat"><b>${passed}/${ex.length}</b><span>esami superati</span></div>
    </div>
    <p class="note">Archivio: listato ufficiale A/B del Ministero delle Infrastrutture e dei Trasporti del ${B.v.split('-').reverse().join('/')}, ${nf(Q.length)} quesiti con le figure originali, preso dal progetto open source <a href="https://github.com/GoldenNocturne/patente-lab" target="_blank" rel="noopener">Patente Lab</a> (licenza MIT per il codice). Il Ministero può aggiornare il listato: l'ultima versione è sul <a href="https://www.ilportaledellautomobilista.it" target="_blank" rel="noopener">Portale dell'Automobilista</a>.</p>
  </div>`;
}
function topicsView(){
  const wl=wrongPool().length;
  const items=CH.map((_,c)=>{const s=chapStats(c),p=pct(s.ok,s.seen);
    return `<button class="card listbtn" data-act="topic-start" data-c="${c}"><div class="l"><b>${esc(B.c[c][0])}</b><em>${nf(s.n)}</em></div><div class="l"><span class="small muted">${s.seen?`${nf(s.seen)} viste · ${p}% corrette`:'da iniziare'}</span></div><div class="bar"><i style="width:${pct(s.seen,s.n)}%"></i></div></button>`;}).join('');
  return `<div class="wrap"><header class="head"><h2>Quiz per argomento</h2><p>I 25 capitoli del listato ufficiale. Ogni serie ha 20 domande e ripropone prima quelle sbagliate e quelle nuove.</p></header>
    <button class="card listbtn" data-act="errors-start" ${wl?'':'disabled'}><div class="l"><b>Ripassa gli errori</b><em>${nf(wl)}</em></div></button>
    ${items}</div>`;
}
function examView(){
  const h=store.exams.slice(-5).reverse().map(e=>`<div><span>${new Date(e.t).toLocaleDateString('it-IT',{day:'2-digit',month:'short'})} · ${e.err} ${e.err===1?'errore':'errori'}</span><span class="pill ${e.pass?'pass':'fail'}">${e.pass?'Promosso':'Bocciato'}</span></div>`).join('');
  return `<div class="wrap"><header class="head"><h2>Simulazione d'esame</h2><p>Trenta affermazioni da giudicare Vero o Falso, venti minuti di tempo. Con 4 errori o più la prova non è superata. Le domande non risposte contano come errori.</p></header>
    <button class="examcard" data-act="exam-start"><span class="eyebrow">Prova completa</span><span class="big">Avvia la prova</span><span class="meta">30 domande · 20 minuti · massimo 3 errori</span><span class="go">Inizia →</span></button>
    <div class="card"><h3 style="margin-bottom:10px">Ultime simulazioni</h3>${h?`<div class="hist">${h}</div>`:'<p class="muted">Non hai ancora fatto nessuna simulazione.</p>'}</div>
    <p class="note">Le 30 domande sono estratte a caso dall'archivio, al massimo una per gruppo di quesiti e non più di tre per capitolo. Nella prova puoi tornare indietro e cambiare le risposte dal riepilogo finale, come nell'esame al computer.</p></div>`;
}

const KINDS={
  visual:{name:'Riflessi visivi',desc:'Tocca appena lo schermo diventa verde.',bands:[260,340,450]},
  audio:{name:'Riflessi uditivi',desc:'Tocca appena senti il suono. Alza il volume o usa l\'altoparlante.',bands:[220,300,400]},
  combo:{name:'Segnale misto',desc:'Può arrivare uno schermo verde o un suono: reagisci a entrambi.',bands:[250,330,430]}
};
function reflexView(){
  if(RES)return resultReflex();
  const cards=Object.keys(KINDS).map(k=>{const s=store.reflex[k];
    return `<button class="card tile" style="min-height:0" data-act="reflex-start" data-k="${k}"><b>${KINDS[k].name}</b><span>${KINDS[k].desc}</span><span>${s?`Ultima media ${s.last} ms · migliore ${s.bestAvg} ms`:'Non ancora provato'}</span></button>`;}).join('');
  return `<div class="wrap"><header class="head"><h2>Test dei riflessi</h2><p>Cinque prove per ogni test. Se tocchi prima del segnale, la prova si ripete.</p></header>
    ${cards}
    <p class="note">È un allenamento alla prontezza, non un esame medico: vista e udito per la patente li controlla il medico. I tempi includono il ritardo di schermo e audio del telefono, quindi confrontali con te stesso nel tempo più che con altri. Con cuffie Bluetooth il suono arriva in ritardo.</p></div>`;
}
function resultReflex(){
  const r=RES,K=KINDS[r.kind],b=K.bands;
  const lab=r.avg<b[0]?'Molto pronto':r.avg<b[1]?'Nella norma':r.avg<b[2]?'Un po\' lento':'Lento: riprova riposato';
  const m=v=>(v/3.6*r.avg/1000).toFixed(1).replace('.',',');
  return `<div class="wrap"><header class="head"><h2>${K.name}</h2></header>
    <div class="card"><span class="eyebrow muted">Tempo medio</span><div class="big-n">${r.avg} <span style="font-size:26px">ms</span></div><p>${lab}. Migliore: ${r.best} ms${r.early?` · partenze anticipate: ${r.early}`:''}.</p></div>
    <div class="card"><h3 style="margin-bottom:8px">Le tue cinque prove</h3><div class="rts">${r.rts.map(x=>`<span>${x}</span>`).join('')}</div></div>
    <div class="card"><h3 style="margin-bottom:8px">Quanta strada fai prima di reagire</h3><p>In ${r.avg} ms un'auto percorre circa <b>${m(50)} m a 50 km/h</b> e circa <b>${m(130)} m a 130 km/h</b>, senza aver ancora premuto il freno.</p></div>
    <div class="btnrow"><button class="btn alt" data-act="reflex-back">Indietro</button><button class="btn" data-act="reflex-again" data-k="${r.kind}">Riprova</button></div></div>`;
}

/* ---------- Sessione quiz ---------- */
function sessionView(){
  if(S.view==='res')return resultView();
  if(S.view==='sum')return summaryView();
  const i=S.ids[S.idx],q=Q[i],a=S.ans[S.idx],ex=S.mode==='exam',n=S.ids.length,done=!ex&&a!==null,right=q[ANS]===1;
  const btn=(v,l)=>{let c='abtn';if(ex&&a===v)c+=' sel';if(done){if(right===v)c+=' ok';else if(a===v)c+=' bad';}
    return `<button class="${c}" data-act="ans" data-v="${v?1:0}" ${done?'disabled':''}>${l}</button>`;};
  const top=ex
    ?`<div class="qtop"><button class="ghost" data-act="exit">‹ Esci</button><span class="cnt">${S.idx+1}/${n}</span><span class="tm" id="tm">${fmt(S.endAt-Date.now())}</span></div>`
    :`<div class="qtop"><button class="ghost" data-act="exit">‹ Esci</button><span class="cnt">${S.idx+1}/${n}</span><span class="chip">${esc(B.c[q[CAP]][0])}</span></div>`;
  const conf=S.confirm?`<div class="card"><p style="margin-bottom:12px"><b>Abbandonare la simulazione?</b> Le risposte date finora andranno perse.</p><div class="btnrow"><button class="btn alt" data-act="exit-no">Continua</button><button class="btn" data-act="exit-yes">Abbandona</button></div></div>`:'';
  const fb=done?`<div class="fb ${a===right?'ok':'bad'}"><strong>${a===right?'Corretto.':'Sbagliato.'}</strong> La risposta giusta è ${right?'Vero':'Falso'}.</div>
    <button class="btn" data-act="next">${S.idx<n-1?'Avanti':'Vedi il risultato'}</button>`:'';
  const nav=ex?`<div class="btnrow"><button class="btn alt" data-act="prev" ${S.idx===0?'disabled':''}>‹ Indietro</button><button class="btn alt" data-act="sum">Riepilogo</button></div>`:'';
  const nx=S.ids[S.idx+1];if(nx!==undefined&&Q[nx][IMG]>=0){(new Image()).src=`f/${Q[nx][IMG]}.jpg`;}
  return `<div class="wrap">${top}<div class="prog"><i style="width:${Math.round(100*(S.idx+(done?1:0))/n)}%"></i></div>${conf}
    <div class="qcard">${fig(q[IMG])}<p class="qtext">${esc(q[TXT])}</p></div>
    <div class="ans">${btn(true,'Vero')}${btn(false,'Falso')}</div>${fb}${nav}</div>`;
}
function summaryView(){
  const un=S.ans.filter(a=>a===null).length;
  const cells=S.ans.map((a,i)=>`<button class="cell ${a===null?'empty':'done'}" data-act="goto" data-i="${i}" aria-label="Domanda ${i+1}, ${a===null?'senza risposta':a?'Vero':'Falso'}">${i+1}<small>${a===null?'–':a?'V':'F'}</small></button>`).join('');
  return `<div class="wrap"><div class="qtop"><h2>Riepilogo</h2><span class="tm" id="tm">${fmt(S.endAt-Date.now())}</span></div>
    <p>${un?`Hai ${un} ${un===1?'domanda':'domande'} senza risposta: ${un===1?'conta':'contano'} come errore.`:'Hai risposto a tutte le domande.'} Tocca un numero per rivederla.</p>
    <div class="cells">${cells}</div>
    <button class="btn" data-act="submit">Consegna l'esame</button></div>`;
}
function resultView(){
  const ex=S.mode==='exam',n=S.ids.length,err=S.errors;
  const head=ex
    ?`<div class="verdict ${S.pass?'pass':'fail'}"><b>${S.pass?'Promosso':'Bocciato'}</b><span>${err} ${err===1?'errore':'errori'} su ${n}. Il massimo consentito è 3.</span></div>`
    :`<div class="verdict ${err===0?'pass':'plain'}"><b>${n-err} su ${n}</b><span>${err===0?'Tutte corrette.':err+(err===1?' risposta da rivedere.':' risposte da rivedere.')}</span></div>`;
  const rev=S.wrong.map(({i,a})=>{const q=Q[i];
    return `<div class="card rev"><span class="tag">${esc(B.c[q[CAP]][0])}</span>${fig(q[IMG])}<p><b>${esc(q[TXT])}</b></p><p class="small muted">${a===null?'Non hai risposto':'Hai risposto '+(a?'Vero':'Falso')}. Corretta: ${q[ANS]===1?'Vero':'Falso'}.</p></div>`;}).join('');
  const again=ex?'exam-start':'again';
  return `<div class="wrap">${head}${rev?`<h3>Da rivedere</h3>${rev}`:''}
    <div class="btnrow"><button class="btn alt" data-act="exit-yes">Home</button><button class="btn" data-act="${again}">${ex?'Nuova simulazione':'Altre 20'}</button></div></div>`;
}

/* ---------- Azioni quiz ---------- */
function startPractice(title,pool){
  const ids=pickSeries(pool,20);if(!ids.length)return;
  S={mode:'practice',title,pool,ids,idx:0,ans:ids.map(()=>null),view:'q'};render(true);
}
function startExam(){
  const sh=shuffle(Q.map((_,i)=>i)),gs=new Set(),cc={},pick=[];
  for(const i of sh){
    const g=Q[i][GRP],c=Q[i][CAP];
    if(gs.has(g)||(cc[c]||0)>=3)continue;
    gs.add(g);cc[c]=(cc[c]||0)+1;pick.push(i);if(pick.length===30)break;
  }
  S={mode:'exam',title:"Simulazione d'esame",ids:pick,idx:0,ans:pick.map(()=>null),view:'q',endAt:Date.now()+20*60*1000,fromSum:false,confirm:false};
  S.iv=setInterval(tick,500);render(true);
}
function tick(){
  if(!S||S.mode!=='exam'||S.view==='res')return;
  const rem=S.endAt-Date.now(),el=document.getElementById('tm');
  if(el){el.textContent=fmt(rem);el.classList.toggle('low',rem<60000);}
  if(rem<=0)finish();
}
function answer(v){
  if(!S||S.view!=='q')return;
  const i=S.ids[S.idx],right=Q[i][ANS]===1;
  if(S.mode==='exam'){
    S.ans[S.idx]=v;
    if(S.fromSum||S.idx===S.ids.length-1){S.view='sum';S.fromSum=false;}else S.idx++;
    render(true);return;
  }
  if(S.ans[S.idx]!==null)return;
  S.ans[S.idx]=v;rec(i,v===right);render();
}
function finish(){
  if(S.iv)clearInterval(S.iv);
  const items=S.ids.map((i,k)=>({i,a:S.ans[k]}));
  if(S.mode==='exam')items.forEach(({i,a})=>{if(a!==null)rec(i,a===(Q[i][ANS]===1));});
  S.wrong=items.filter(x=>x.a!==(Q[x.i][ANS]===1));S.errors=S.wrong.length;
  if(S.mode==='exam'){S.pass=S.errors<=3;store.exams.push({t:Date.now(),err:S.errors,pass:S.pass});store.exams=store.exams.slice(-20);save();}
  S.view='res';render(true);
}
function leave(){if(S&&S.iv)clearInterval(S.iv);S=null;render(true);}

/* ---------- Riflessi ---------- */
function setArena(cls,top,big,sub){arena.className='arena'+(cls?' '+cls:'');document.getElementById('ar-top').textContent=top||'';document.getElementById('ar-big').textContent=big||'';document.getElementById('ar-sub').textContent=sub||'';}
function startReflex(kind){
  let ctx=null;
  if(kind!=='visual'){try{ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.resume)ctx.resume();}catch(e){ctx=null;}}
  if(kind==='audio'&&!ctx){RES=null;app.innerHTML=`<div class="wrap"><header class="head"><h2>Audio non disponibile</h2><p>Questo browser non permette di riprodurre suoni. Prova il test visivo.</p></header><button class="btn" data-act="reflex-back">Indietro</button></div>`;return;}
  R={kind,rts:[],early:0,state:'idle',t0:0,timer:null,ctx,mode:null,active:true};
  arena.hidden=false;arena.focus({preventScroll:true});
  nextRound();
}
function nextRound(){
  if(!R)return;
  R.state='wait';
  const n=R.rts.length+1;
  const hint=R.kind==='audio'?'Ascolta il suono. Puoi chiudere gli occhi.':R.kind==='combo'?'Verde o suono: tocca appena arriva.':'Tocca quando diventa verde.';
  setArena('',`${KINDS[R.kind].name} · prova ${n} di 5`,'Aspetta…',hint);
  R.timer=setTimeout(go,1500+Math.random()*2800);
}
function beep(){
  const c=R.ctx;if(!c)return;
  try{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=880;g.gain.value=.35;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.35);}catch(e){}
}
function go(){
  if(!R)return;
  const mode=R.kind==='combo'?(Math.random()<.5?'visual':'audio'):R.kind;
  R.mode=mode;
  if(mode==='visual'){
    setArena('go',`${KINDS[R.kind].name} · prova ${R.rts.length+1} di 5`,'ORA!','Tocca lo schermo');
    requestAnimationFrame(()=>{if(R&&R.mode==='visual'){R.t0=performance.now();R.state='go';}});
  }else{
    setArena('',`${KINDS[R.kind].name} · prova ${R.rts.length+1} di 5`,'Ascolta…','');
    beep();R.t0=performance.now();R.state='go';
  }
}
function tap(){
  if(!R)return;
  if(R.state==='wait'){
    clearTimeout(R.timer);R.state='early';R.early++;
    setArena('early','Troppo presto','✕','Aspetta il segnale. La prova si ripete.');
    R.timer=setTimeout(nextRound,1400);
  }else if(R.state==='go'&&R.t0){
    const rt=Math.round(performance.now()-R.t0);
    R.rts.push(rt);R.state='show';
    setArena(R.mode==='visual'?'go':'',R.mode==='visual'?'Visivo':'Uditivo',rt+' ms','');
    R.timer=setTimeout(R.rts.length>=5?finishReflex:nextRound,1100);
  }
}
function finishReflex(){
  const rts=R.rts,avg=Math.round(rts.reduce((a,b)=>a+b,0)/rts.length),best=Math.min(...rts);
  const prev=store.reflex[R.kind];
  store.reflex[R.kind]={last:avg,bestAvg:prev?Math.min(prev.bestAvg,avg):avg};save();
  RES={kind:R.kind,rts,avg,best,early:R.early};
  closeArena();tab='reflex';render(true);
}
function closeArena(){if(R&&R.timer)clearTimeout(R.timer);if(R&&R.ctx&&R.ctx.close){try{R.ctx.close();}catch(e){}}R=null;arena.hidden=true;}

/* ---------- Render e eventi ---------- */
const app=document.getElementById('app'), arena=document.getElementById('arena');
function render(sc){
  document.body.classList.toggle('hidenav',!!S&&S.view!=='res');
  if(!B)app.innerHTML=loadingView();
  else if(S)app.innerHTML=sessionView();
  else app.innerHTML=tab==='home'?homeView():tab==='topics'?topicsView():tab==='exam'?examView():reflexView();
  document.querySelectorAll('#nav button').forEach(b=>{if(!S&&b.dataset.t===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  if(sc)window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.dataset.act;
  if(!B&&a!=='reflex-start'&&a!=='reflex-exit'&&a!=='reflex-back'&&a!=='reflex-again'&&a!=='tab'&&a!=='retry')return;
  switch(a){
    case 'retry':loadBank();render();break;
    case 'tab':if(S)return;RES=null;tab=el.dataset.t;render(true);break;
    case 'exam-start':if(S&&S.iv)clearInterval(S.iv);startExam();break;
    case 'topic-start':{const c=+el.dataset.c;startPractice(B.c[c][0],CH[c]);break;}
    case 'signals-start':startPractice('Segnali con figure',SIGNAL_CH.flatMap(c=>CH[c]));break;
    case 'errors-start':startPractice('Ripasso errori',wrongPool());break;
    case 'again':startPractice(S.title,S.pool);break;
    case 'ans':answer(el.dataset.v==='1');break;
    case 'next':if(S.idx<S.ids.length-1){S.idx++;render(true);}else finish();break;
    case 'prev':if(S.idx>0){S.idx--;render(true);}break;
    case 'sum':S.view='sum';render(true);break;
    case 'goto':S.idx=+el.dataset.i;S.view='q';S.fromSum=true;render(true);break;
    case 'submit':finish();break;
    case 'exit':if(S.mode==='exam'&&S.view!=='res'){S.confirm=true;render(true);}else leave();break;
    case 'exit-no':S.confirm=false;render();break;
    case 'exit-yes':leave();break;
    case 'reflex-start':case 'reflex-again':RES=null;startReflex(el.dataset.k);break;
    case 'reflex-back':RES=null;render(true);break;
    case 'reflex-exit':closeArena();render(true);break;
  }
});
arena.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();tap();});
document.addEventListener('keydown',e=>{
  if(R&&(e.key===' '||e.key==='Enter')&&!e.target.closest('button')){e.preventDefault();tap();return;}
  if(S&&S.view==='q'&&!e.target.closest('button')){
    const k=e.key.toLowerCase();
    if(k==='v')answer(true);else if(k==='f')answer(false);
  }
});
render();
loadBank();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
